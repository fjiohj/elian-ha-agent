name: elian HA Agent
version: "0.1.0"
slug: elian_agent
description: 将本地 Home Assistant 安全连接到 elianiot 云平台
url: https://elianiot.com

arch:
  - aarch64
  - amd64
  - armv7

startup: services
boot: auto
init: false
homeassistant_api: true
host_network: false

options:
  cloud_url: "wss://elianiot.com/api/v1/agent/connect"
  pair_code: ""
  ha_url: "http://supervisor/core"
  ha_token: ""
  heartbeat_seconds: 30

schema:
  cloud_url: url
  pair_code: str
  ha_url: str
  ha_token: password
  heartbeat_seconds: int
